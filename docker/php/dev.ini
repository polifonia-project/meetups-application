; Development error settings for the MEETUPS container.
; Mounted read-only into /usr/local/etc/php/conf.d/ by docker-compose.yaml.

; Report everything, including the notices PHP 7.2 hides by default
; (e.g. "Trying to get property of non-object" when a SPARQL response
; fails to decode).
error_reporting = E_ALL

; Keep errors OUT of the response body: the /services/*.php endpoints emit
; JSON, and an inline warning corrupts it so the front-end silently gets
; nothing. Send them to the log instead.
display_errors = Off
display_startup_errors = Off

; stderr is Apache's error stream in this image, so everything below shows up
; in `docker compose logs -f php`.
log_errors = On
error_log = /dev/stderr
log_errors_max_len = 0

; Long-running SPARQL queries against the remote endpoint
max_execution_time = 120
